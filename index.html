<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>모몽가 궁디팡팡</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --mode-color:  #ffb6c1;
      --mode-pulse:  rgba(255,182,193,.55);
      --mode-glow:   rgba(255,182,193,.35);
      --card-border: rgba(255,182,193,.55);
    }
    :root.angry {
      --mode-color:  #ff5252;
      --mode-pulse:  rgba(255,82,82,.55);
      --mode-glow:   rgba(255,82,82,.30);
      --card-border: rgba(255,82,82,.45);
    }

    body {
      background: #fef6ec;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center;
      padding: 24px 16px 20px;
      -webkit-tap-highlight-color: transparent;
      user-select: none; overflow-x: hidden;
    }

    /* ── 헤더 ── */
    .header {
      width: 100%; max-width: 500px;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .title    { font-size: 22px; font-weight: 800; color: #4a3728; letter-spacing: -.5px; line-height: 1.2; }
    .subtitle { font-size: 12px; font-weight: 500; color: #a07850; margin-top: 2px; }
    .header-actions { display: flex; gap: 6px; align-items: center; }
    .icon-btn {
      width: 34px; height: 34px; border-radius: 50%; border: none;
      background: rgba(255,245,230,.9);
      box-shadow: 0 1px 6px rgba(160,100,40,.12);
      font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      touch-action: manipulation; transition: transform .12s, background .12s;
    }
    .icon-btn:active { transform: scale(.88); background: #ffe8cc; }

    /* ── 모드 토글 ── */
    .mode-toggle {
      width: 100%; max-width: 500px;
      display: flex; gap: 8px; margin-bottom: 10px;
    }
    .mode-btn {
      flex: 1; padding: 9px 0; border-radius: 14px; border: none;
      font-family: inherit; font-size: 14px; font-weight: 700;
      cursor: pointer; touch-action: manipulation;
      transition: background .25s, color .25s, opacity .25s, box-shadow .25s;
    }
    .mode-btn.love        { background: #fff0f3; color: #c4003a; box-shadow: 0 2px 8px rgba(255,182,193,.25); }
    .mode-btn.love.active { background: #ffb6c1; color: #fff;    box-shadow: 0 3px 12px rgba(255,100,140,.30); }
    .mode-btn.angry        { background: #fff3f0; color: #c40000; box-shadow: 0 2px 8px rgba(255,82,82,.15); }
    .mode-btn.angry.active { background: #ff5252; color: #fff;    box-shadow: 0 3px 12px rgba(255,60,60,.35); }
    .mode-btn:not(.active) { opacity: .5; }

    /* ══════════════════════════════════════
       영상 외부 래퍼 (top-bar + card-wrap 묶음)
    ══════════════════════════════════════ */
    .video-outer {
      width: 100%; max-width: 500px;
      display: flex; flex-direction: column; gap: 8px;
    }

    /* ── top-bar: 카운터·레벨 배지 ── */
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      height: 36px;
    }
    .badge-count,
    .badge-level {
      padding: 5px 13px; border-radius: 999px;
      font-size: 12px; font-weight: 700;
      background: rgba(255,245,230,.95); color: #7a4f2a;
      border: 1.5px solid rgba(255,220,180,.7);
      white-space: nowrap;
      transition: color .3s;
    }

    /* ── 말풍선 레이어 (card-wrap 기준 위쪽) ── */
    .bubble-layer {
      position: absolute; bottom: 100%; left: 0; right: 0;
      height: 80px; pointer-events: none; z-index: 40; overflow: visible;
    }
    .bubble {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      background: #fff; border: 2px solid var(--mode-color); border-radius: 14px;
      padding: 7px 15px; font-size: 15px; font-weight: 700; color: #4a3728;
      white-space: nowrap;
      box-shadow: 0 4px 16px var(--mode-glow), 0 1px 4px rgba(0,0,0,.06);
      animation: bubble-rise 1.1s ease-out forwards; pointer-events: none;
    }
    .bubble::after {
      content: ''; position: absolute; bottom: -9px; left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent; border-top-color: var(--mode-color);
    }
    .bubble::before {
      content: ''; position: absolute; bottom: -6px; left: 50%;
      transform: translateX(-50%);
      border: 4px solid transparent; border-top-color: #fff; z-index: 1;
    }
    @keyframes bubble-rise {
      0%   { opacity: 1; transform: translateX(-50%) translateY(0); }
      20%  { opacity: 1; transform: translateX(-50%) translateY(-6px); }
      75%  { opacity: 1; transform: translateX(-50%) translateY(-38px); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-46px); }
    }

    /* ── card-wrap: shake/squash 애니메이션 대상 ── */
    .card-wrap {
      position: relative;
      width: 100%;
      /* aspect-ratio는 JS의 loadedmetadata에서 동적 주입, 기본값 16/9 */
      aspect-ratio: 16 / 9;
      border-radius: 24px;
      will-change: transform;
    }

    /* ── card: overflow hidden 격리 ── */
    .card {
      position: absolute; inset: 0; border-radius: 24px; overflow: hidden;
      box-shadow: 0 6px 28px rgba(160,100,40,.12), 0 2px 6px rgba(160,100,40,.07);
      border: 2.5px solid var(--card-border);
      background: #fef6ec;           /* contain 시 letterbox 배경 */
      transition: border-color .3s, box-shadow .3s;
    }
    .card.glow { box-shadow: 0 0 0 4px var(--mode-glow), 0 8px 28px var(--mode-glow); }

    .card video {
      width: 100%; height: 100%;
      object-fit: contain;           /* ← cover → contain: 잘림 없음 */
      display: block; pointer-events: none;
    }

    /* ── 핫존: 클릭 감지 전용, 시각화 없음 ── */
    .hot-zone {
      position: absolute;
      left: 0; width: 50%;
      top: 25%; height: 45%;
      background: transparent;
      border: none;
      pointer-events: none; z-index: 5;
    }

    /* ── 콤보 배지 (카드 우하단) ── */
    #badgeCombo {
      position: absolute; bottom: 10px; right: 10px; z-index: 20;
      padding: 4px 11px; border-radius: 999px;
      font-size: 12px; font-weight: 800;
      background: var(--mode-color); color: #fff;
      white-space: nowrap;
      opacity: 0; transform: scale(.7);
      transition: opacity .2s, transform .2s, background .3s;
      pointer-events: none;
    }
    #badgeCombo.show { opacity: 1; transform: scale(1); }
    #badgeCombo.pop  { animation: combo-pop .18s cubic-bezier(.36,1.6,.6,1); }
    @keyframes combo-pop { 50% { transform: scale(1.35); } }

    /* ── 탭존 ── */
    .tap-zone {
      position: absolute; inset: 0; cursor: pointer; z-index: 10;
      touch-action: manipulation;
    }

    /* ══════════════════════════
       이펙트 레이어
    ══════════════════════════ */
    .pop-layer {
      position: absolute; inset: 0; z-index: 15;
      pointer-events: none; overflow: visible;
    }

    .impact-hand {
      position: absolute; font-size: 36px; line-height: 1;
      pointer-events: none; transform-origin: center bottom;
      animation: hand-slam .22s cubic-bezier(.36,1.6,.6,1) forwards;
    }
    .impact-hand.hot { font-size: 48px; animation-name: hand-slam-hot; }
    @keyframes hand-slam {
      0%  { opacity: 0; transform: scale(.25) rotate(-15deg); }
      50% { opacity: 1; transform: scale(1.35) rotate(-8deg); }
      100%{ opacity: 0; transform: scale(.9)   rotate(-3deg); }
    }
    @keyframes hand-slam-hot {
      0%  { opacity: 0; transform: scale(.25) rotate(-15deg); }
      50% { opacity: 1; transform: scale(1.55) rotate(-6deg); }
      100%{ opacity: 0; transform: scale(.9)   rotate(-2deg); }
    }

    .impact-pulse {
      position: absolute; border-radius: 50%;
      border: 3.5px solid var(--mode-color);
      pointer-events: none;
      animation: pulse-ring .45s ease-out forwards;
    }
    @keyframes pulse-ring {
      0%  { transform: scale(0); opacity: 1; }
      100%{ transform: scale(3); opacity: 0; }
    }

    .angry-flash {
      position: absolute; inset: 0;
      background: rgba(255,220,50,.22);
      pointer-events: none; animation: do-flash .2s ease-out forwards; z-index: 13;
    }
    .love-flash {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, rgba(255,182,193,.28), transparent 70%);
      pointer-events: none; animation: do-flash .25s ease-out forwards; z-index: 13;
    }
    @keyframes do-flash { 0%{ opacity:1; } 100%{ opacity:0; } }

    .ripple {
      position: absolute; border-radius: 50%;
      background: var(--mode-pulse);
      transform: scale(0); animation: ripple-out .45s ease-out forwards;
      pointer-events: none;
    }
    @keyframes ripple-out { to { transform: scale(4); opacity: 0; } }

    @keyframes impact-love {
      0%  { transform: scale(1); }
      15% { transform: translateX(-4px)  scale(1.01,.97); }
      35% { transform: translateX(4px)   scale(1.02,1.00); }
      55% { transform: translateX(-2px)  scale(1.01,.98); }
      75% { transform: translateX(2px)   scale(1.01,1.0); }
      100%{ transform: translate(0)      scale(1); }
    }
    @keyframes impact-angry {
      0%  { transform: scale(1); }
      12% { transform: translate(-10px,-3px) scale(1.01,.93); }
      28% { transform: translate(10px, 3px)  scale(1.03,1.01); }
      44% { transform: translate(-6px,-4px)  scale(1.01,.96); }
      60% { transform: translate(6px, 2px)   scale(1.02,1.01); }
      80% { transform: translate(-2px,0)     scale(1); }
      100%{ transform: translate(0)          scale(1); }
    }
    .card-wrap.shake-love  { animation: impact-love  .30s cubic-bezier(.34,1.56,.64,1) forwards; }
    .card-wrap.shake-angry { animation: impact-angry  .36s cubic-bezier(.34,1.56,.64,1) forwards; }

    /* ── 레벨업 오버레이 ── */
    #levelFlash {
      position: fixed; inset: 0; z-index: 200;
      background: var(--mode-pulse); opacity: 0; pointer-events: none;
    }
    @keyframes flash-in-out { 0%{opacity:0} 25%{opacity:1} 100%{opacity:0} }

    #levelUpText {
      position: fixed; inset: 0; z-index: 201;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none; opacity: 0;
    }
    #levelUpText span {
      font-size: clamp(30px,8vw,48px); font-weight: 900; color: #fff;
      letter-spacing: -1px; padding: 10px 28px; border-radius: 18px;
      background: var(--mode-color); box-shadow: 0 6px 28px var(--mode-glow);
      transform: scale(.6);
    }
    @keyframes levelup-pop {
      0%  { opacity:0; transform:scale(.6); }
      20% { opacity:1; transform:scale(1.1); }
      45% { transform:scale(.96); }
      65% { transform:scale(1.02); opacity:1; }
      85% { opacity:1; transform:scale(1); }
      100%{ opacity:0; transform:scale(1.04); }
    }

    /* ── 튜토리얼 힌트 ── */
    .hint {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      font-size: 13px; font-weight: 600; color: rgba(255,255,255,.9);
      background: rgba(74,55,40,.55); padding: 6px 16px; border-radius: 999px;
      pointer-events: none; z-index: 25; white-space: nowrap;
      animation: hint-fade 3.5s ease-out forwards;
    }
    @keyframes hint-fade { 0%{opacity:1} 70%{opacity:1} 100%{opacity:0} }

    /* ── 하단 버튼 ── */
    .buttons {
      display: flex; justify-content: center;
      margin-top: 12px; width: 100%; max-width: 500px;
    }
    .btn {
      display: flex; flex-direction: column;
      align-items: center; gap: 3px; padding: 10px 28px;
      border: none; border-radius: 16px;
      background: #fff5e8; color: #7a4f2a;
      font-family: inherit; font-size: 11px; font-weight: 700;
      cursor: pointer; box-shadow: 0 2px 6px rgba(160,100,40,.09);
      transition: transform .12s, background .12s;
      touch-action: manipulation;
    }
    .btn .btn-icon { font-size: 18px; line-height: 1; }
    .btn:active { transform: scale(.93); background: #ffe8cc; }

    /* ── 토스트 ── */
    .toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: rgba(74,55,40,.88); color: #fff5e8;
      font-size: 13px; font-weight: 600;
      padding: 9px 20px; border-radius: 999px;
      opacity: 0; pointer-events: none;
      transition: opacity .22s, transform .22s;
      white-space: nowrap; z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ══════════════════════════════════════
       메시지 편집 모달
    ══════════════════════════════════════ */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(74,55,40,.45);
      display: flex; align-items: flex-end; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      width: 100%; max-width: 500px; max-height: 82dvh;
      background: #fffaf5; border-radius: 24px 24px 0 0;
      padding: 20px 18px 32px;
      overflow-y: auto; overscroll-behavior: contain;
      transform: translateY(100%);
      transition: transform .28s cubic-bezier(.32,1,.56,1);
      display: flex; flex-direction: column; gap: 18px;
    }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal-title {
      font-size: 17px; font-weight: 800; color: #4a3728;
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-close {
      width: 30px; height: 30px; border-radius: 50%; border: none;
      background: #f0e8df; color: #7a4f2a; font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      touch-action: manipulation;
    }
    .modal-close:active { background: #e0d0c0; }
    .msg-section-title { font-size: 13px; font-weight: 700; color: #a07850; margin-bottom: 8px; }
    .msg-list { display: flex; flex-direction: column; gap: 6px; }
    .msg-row  { display: flex; gap: 6px; align-items: center; }
    .msg-input {
      flex: 1; padding: 8px 12px; border-radius: 10px;
      border: 1.5px solid #e8d8c4; background: #fff;
      font-family: inherit; font-size: 14px; color: #4a3728;
      outline: none; transition: border-color .15s;
    }
    .msg-input:focus { border-color: var(--mode-color, #ffb6c1); }
    .msg-del {
      width: 28px; height: 28px; border-radius: 50%; border: none;
      background: #f5e8df; color: #a07850; font-size: 14px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; touch-action: manipulation;
    }
    .msg-del:active { background: #ffd0c0; color: #c44; }
    .add-btn {
      align-self: flex-start; padding: 7px 14px; border-radius: 999px;
      border: 1.5px dashed #d0b89a; background: transparent;
      color: #a07850; font-family: inherit; font-size: 13px; font-weight: 600;
      cursor: pointer; touch-action: manipulation; margin-top: 4px;
      transition: background .12s;
    }
    .add-btn:active { background: #f5e8df; }
    .modal-actions { display: flex; gap: 8px; margin-top: 4px; }
    .modal-save {
      flex: 2; padding: 12px; border-radius: 14px; border: none;
      background: #ffb6c1; color: #fff;
      font-family: inherit; font-size: 14px; font-weight: 700;
      cursor: pointer; touch-action: manipulation; transition: background .12s;
    }
    .modal-save:active { background: #ff8fa3; }
    .modal-reset {
      flex: 1; padding: 12px; border-radius: 14px;
      border: 1.5px solid #e8d8c4; background: #fff;
      color: #a07850; font-family: inherit; font-size: 13px; font-weight: 600;
      cursor: pointer; touch-action: manipulation;
    }
    .modal-reset:active { background: #f5e8df; }
  </style>
</head>
<body>

  <!-- 레벨업 오버레이 -->
  <div id="levelFlash"></div>
  <div id="levelUpText"><span id="levelUpSpan">레벨 업!</span></div>

  <!-- 헤더 -->
  <div class="header">
    <div class="title-block">
      <div class="title">모몽가 궁디팡팡</div>
      <div class="subtitle">엉덩이를 톡톡 두드려보세요</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btnEditMsg" title="메시지 편집">✏️</button>
      <button class="icon-btn" id="btnMute"    title="소리 토글">🔔</button>
    </div>
  </div>

  <!-- 모드 토글 -->
  <div class="mode-toggle">
    <button class="mode-btn love active" id="modeL">애껴주기</button>
    <button class="mode-btn angry"       id="modeA">화내기</button>
  </div>

  <!-- 영상 + 배지 묶음 -->
  <div class="video-outer">

    <!-- 배지 top-bar -->
    <div class="top-bar">
      <div class="badge-count" id="badgeCount">토닥 0회</div>
      <div class="badge-level" id="badgeLevel">기분 좋아</div>
    </div>

    <!-- 카드 래퍼 (shake/squash 대상) -->
    <div class="card-wrap" id="cardWrap">
      <div class="bubble-layer" id="bubbleLayer"></div>

      <div class="card" id="card">
        <video id="vid" src="momong.mp4" autoplay loop muted playsinline preload="auto"></video>

        <div class="pop-layer" id="popLayer"></div>

        <!-- 핫존: 좌측 0~50%, 세로 25~70% — 영상 보고 미세조정 -->
        <div class="hot-zone" id="hotZoneEl"></div>

        <div id="badgeCombo"></div>
        <div class="tap-zone" id="tapZone"></div>
      </div>
    </div>

  </div>

  <!-- 하단 버튼 -->
  <div class="buttons">
    <button class="btn" id="btnReset"><span class="btn-icon">🔄</span>리셋</button>
  </div>

  <div class="toast" id="toast"></div>

  <!-- 메시지 편집 모달 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-title">
        메시지 편집
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div>
        <div class="msg-section-title">애껴주기 메시지</div>
        <div class="msg-list" id="loveMsgList"></div>
        <button class="add-btn" id="addLoveMsg">+ 메시지 추가</button>
      </div>
      <div>
        <div class="msg-section-title">화내기 메시지</div>
        <div class="msg-list" id="angryMsgList"></div>
        <button class="add-btn" id="addAngryMsg">+ 메시지 추가</button>
      </div>
      <div class="modal-actions">
        <button class="modal-save"  id="modalSave">저장</button>
        <button class="modal-reset" id="modalRestore">기본값으로 복원</button>
      </div>
    </div>
  </div>

  <script>
  (() => {
    /* ── 기본값 ── */
    const DEFAULT_LOVE_MSGS  = ['우리 모몽가 최고','토닥토닥 잘했어','오늘도 사랑해','잘하고 있어','토닥토닥'];
    const DEFAULT_ANGRY_MSGS = ['또 왜 그래!','혼나야겠다','이게 무슨 일이야','정신 차려','혼날래?'];

    const LEVELS = [
      { min:0,  label:'기분 좋아' },
      { min:10, label:'더 해줘'   },
      { min:30, label:'MAX 행복'  },
      { min:60, label:'모몽가 승천' },
    ];

    /* ── localStorage 헬퍼 ── */
    const load = (k, def) => { try { const v = localStorage.getItem(k); return v !== null ? JSON.parse(v) : def; } catch { return def; } };
    const save = (k, v)   => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

    /* ── 상태 ── */
    let mode         = load('mode', 'love');
    let loveCount    = load('loveCount', 0);
    let angryCount   = load('angryCount', 0);
    let loveMsgs     = load('loveMsgs',  DEFAULT_LOVE_MSGS);
    let angryMsgs    = load('angryMsgs', DEFAULT_ANGRY_MSGS);
    let soundEnabled = load('sound', true);
    let comboStreak  = 0;
    let comboTimer   = null;
    let currentLevel = -1;
    let toastTimer   = null;
    let lastTouchEnd = 0;
    let audioCtx     = null;


    /* ── 요소 참조 ── */
    const cardWrap    = document.getElementById('cardWrap');
    const card        = document.getElementById('card');
    const tapZone     = document.getElementById('tapZone');
    const popLayer    = document.getElementById('popLayer');
    const bubbleLayer = document.getElementById('bubbleLayer');
    const badgeCount  = document.getElementById('badgeCount');
    const badgeLevel  = document.getElementById('badgeLevel');
    const badgeCombo  = document.getElementById('badgeCombo');
    const vid         = document.getElementById('vid');
    const toast       = document.getElementById('toast');
    const btnMute     = document.getElementById('btnMute');
    const btnEditMsg  = document.getElementById('btnEditMsg');
    const levelFlash  = document.getElementById('levelFlash');
    const levelUpSpan = document.getElementById('levelUpSpan');
    const levelUpText = document.getElementById('levelUpText');
    const modeL       = document.getElementById('modeL');
    const modeA       = document.getElementById('modeA');
    const modalOverlay= document.getElementById('modalOverlay');
    const loveMsgList = document.getElementById('loveMsgList');
    const angryMsgList= document.getElementById('angryMsgList');

    /* ══════════════════════════════════════
       영상 원본 비율 적용
    ══════════════════════════════════════ */
    function applyVideoRatio() {
      const w = vid.videoWidth; const h = vid.videoHeight;
      if (w && h) cardWrap.style.aspectRatio = `${w} / ${h}`;
    }

    vid.addEventListener('loadedmetadata', applyVideoRatio);
    if (vid.readyState >= 1) applyVideoRatio();

    /* ══════════════════════════════════════
       유틸
    ══════════════════════════════════════ */
    const pick   = arr => arr.length ? arr[Math.floor(Math.random() * arr.length)] : null;
    const isLove = () => mode === 'love';

    /* ══════════════════════════════════════
       모드 전환
    ══════════════════════════════════════ */
    function applyMode() {
      document.documentElement.classList.toggle('angry', !isLove());
      modeL.classList.toggle('active', isLove());
      modeA.classList.toggle('active', !isLove());
      updateBadges();
      save('mode', mode);
    }
    modeL.addEventListener('click', () => { if (mode !== 'love')  { mode = 'love';  applyMode(); } });
    modeA.addEventListener('click', () => { if (mode !== 'angry') { mode = 'angry'; applyMode(); } });

    /* ══════════════════════════════════════
       배지 & 레벨
    ══════════════════════════════════════ */
    function getLevel(n) {
      for (let i = LEVELS.length - 1; i >= 0; i--) if (n >= LEVELS[i].min) return i;
      return 0;
    }
    function updateBadges() {
      const count = isLove() ? loveCount : angryCount;
      badgeCount.textContent = `${isLove() ? '토닥' : '팡팡'} ${count}회`;
      const lv = getLevel(count);
      if (lv !== currentLevel && currentLevel !== -1) triggerLevelUp(LEVELS[lv].label);
      currentLevel = lv;
      badgeLevel.textContent = LEVELS[lv].label;
    }

    /* ══════════════════════════════════════
       레벨업 이펙트
    ══════════════════════════════════════ */
    function triggerLevelUp(label) {
      levelUpSpan.textContent = label + '!';
      levelFlash.style.animation = 'none'; void levelFlash.offsetWidth;
      levelFlash.style.animation = 'flash-in-out .45s ease-out forwards';
      levelUpSpan.style.animation = 'none'; void levelUpSpan.offsetWidth;
      levelUpText.style.opacity = '1';
      levelUpSpan.style.animation = 'levelup-pop .75s cubic-bezier(.34,1.56,.64,1) forwards';
      levelUpSpan.addEventListener('animationend', () => { levelUpText.style.opacity = '0'; }, { once: true });
    }

    /* ══════════════════════════════════════
       콤보 배지
    ══════════════════════════════════════ */
    function updateComboBadge() {
      if (comboStreak >= 2) {
        badgeCombo.textContent = `x${comboStreak} 콤보!`;
        badgeCombo.classList.add('show');
        badgeCombo.classList.remove('pop'); void badgeCombo.offsetWidth;
        badgeCombo.classList.add('pop');
        card.classList.toggle('glow', comboStreak >= 5);
      } else {
        badgeCombo.classList.remove('show','pop');
        card.classList.remove('glow');
      }
    }
    function resetCombo() { comboStreak = 0; updateComboBadge(); }

    /* ══════════════════════════════════════
       사운드
    ══════════════════════════════════════ */
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }
    function playPang(hot) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioCtx(); const now = ctx.currentTime;
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(isLove() ? 260 : 300, now);
        osc.frequency.exponentialRampToValueAtTime(isLove() ? 80 : 60, now + .12);
        gain.gain.setValueAtTime(isLove() ? .42 : .58, now);
        gain.gain.exponentialRampToValueAtTime(.001, now + .13);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + .14);

        const len = ctx.sampleRate * .07;
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const d   = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        const src = ctx.createBufferSource(); src.buffer = buf;
        const ng  = ctx.createGain();
        ng.gain.setValueAtTime(isLove() ? .16 : .28, now);
        ng.gain.exponentialRampToValueAtTime(.001, now + .07);
        src.connect(ng); ng.connect(ctx.destination); src.start(now);
      } catch {}
    }

    btnMute.addEventListener('click', (e) => {
      e.stopPropagation();
      soundEnabled = !soundEnabled;
      btnMute.textContent = soundEnabled ? '🔔' : '🔕';
      save('sound', soundEnabled);
    });
    btnMute.textContent = soundEnabled ? '🔔' : '🔕';

    /* ══════════════════════════════════════
       말풍선
    ══════════════════════════════════════ */
    function spawnBubble(msg) {
      if (!msg) return;
      const el = document.createElement('div');
      el.className = 'bubble'; el.textContent = msg;
      bubbleLayer.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }

    /* ══════════════════════════════════════
       이펙트 헬퍼
    ══════════════════════════════════════ */
    function spawnHand(ox, oy, hot) {
      const el = document.createElement('span');
      el.className = `impact-hand${hot ? ' hot' : ''}`;
      el.textContent = '✋';
      el.style.filter = `hue-rotate(${isLove() ? 0 : 200}deg) saturate(${isLove() ? 1 : 2})`;
      const size = hot ? 48 : 36;
      el.style.cssText += `left:${ox - size/2}px;top:${oy - size/2}px;`;
      popLayer.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }

    function spawnPulse(ox, oy) {
      const el = document.createElement('div'); el.className = 'impact-pulse';
      const size = 44;
      el.style.cssText = `width:${size}px;height:${size}px;left:${ox-size/2}px;top:${oy-size/2}px;`;
      popLayer.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }

    function spawnRipple(ox, oy, hot) {
      const el = document.createElement('div'); el.className = 'ripple';
      const size = hot ? 80 : 55;
      el.style.cssText = `width:${size}px;height:${size}px;left:${ox-size/2}px;top:${oy-size/2}px;`;
      card.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }

    function spawnFlash(hot) {
      const el = document.createElement('div');
      el.className = (!isLove() && hot) ? 'angry-flash' : 'love-flash';
      card.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }

    function shakeCard(hot) {
      const cls = isLove() ? 'shake-love' : 'shake-angry';
      cardWrap.classList.remove('shake-love','shake-angry');
      void cardWrap.offsetWidth;
      cardWrap.classList.add(cls);
      cardWrap.addEventListener('animationend', () => cardWrap.classList.remove(cls), { once: true });
    }

    /* ══════════════════════════════════════
       핵심 탭 처리 (영상 전체 = 적중)
    ══════════════════════════════════════ */
    function handleTap(ox, oy, clientX, clientY) {
      clearTimeout(comboTimer);
      comboStreak++;
      comboTimer = setTimeout(resetCombo, 500);
      updateComboBadge();

      if (isLove()) { loveCount++;  save('loveCount', loveCount); }
      else          { angryCount++; save('angryCount', angryCount); }
      updateBadges();

      playPang(true);
      spawnHand(ox, oy, true);
      spawnPulse(ox, oy);
      spawnRipple(ox, oy, true);
      spawnFlash(true);
      shakeCard(true);

      if (navigator.vibrate) navigator.vibrate(isLove() ? 30 : [50, 30, 50]);

      const pool = isLove() ? loveMsgs : angryMsgs;
      spawnBubble(pick(pool));
    }

    /* ══════════════════════════════════════
       이벤트
    ══════════════════════════════════════ */
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchEnd < 300) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });

    tapZone.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t = e.changedTouches[0]; const r = tapZone.getBoundingClientRect();
      handleTap(t.clientX - r.left, t.clientY - r.top, t.clientX, t.clientY);
    }, { passive: false });

    tapZone.addEventListener('click', (e) => {
      if (e.sourceCapabilities && !e.sourceCapabilities.firesTouchEvents)
        handleTap(e.offsetX, e.offsetY, e.clientX, e.clientY);
    });

    /* ══════════════════════════════════════
       메시지 편집 모달
    ══════════════════════════════════════ */
    function renderMsgList(listEl, msgs) {
      listEl.innerHTML = '';
      msgs.forEach((msg, i) => {
        const row = document.createElement('div'); row.className = 'msg-row';
        const inp = document.createElement('input');
        inp.className = 'msg-input'; inp.type = 'text'; inp.value = msg; inp.maxLength = 30;
        const del = document.createElement('button');
        del.className = 'msg-del'; del.textContent = '✕';
        del.addEventListener('click', () => { msgs.splice(i, 1); renderMsgList(listEl, msgs); });
        row.appendChild(inp); row.appendChild(del); listEl.appendChild(row);
      });
    }

    let editLove, editAngry;
    function openModal() {
      editLove = [...loveMsgs]; editAngry = [...angryMsgs];
      renderMsgList(loveMsgList, editLove); renderMsgList(angryMsgList, editAngry);
      modalOverlay.classList.add('open');
    }
    function closeModal() { modalOverlay.classList.remove('open'); }

    btnEditMsg.addEventListener('click', openModal);
    document.getElementById('modalClose').addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

    document.getElementById('addLoveMsg').addEventListener('click', () => {
      if (editLove.length >= 20) return;
      editLove.push(''); renderMsgList(loveMsgList, editLove);
      loveMsgList.lastElementChild?.querySelector('input')?.focus();
    });
    document.getElementById('addAngryMsg').addEventListener('click', () => {
      if (editAngry.length >= 20) return;
      editAngry.push(''); renderMsgList(angryMsgList, editAngry);
      angryMsgList.lastElementChild?.querySelector('input')?.focus();
    });

    document.getElementById('modalSave').addEventListener('click', () => {
      loveMsgs  = [...loveMsgList.querySelectorAll('.msg-input')].map(i=>i.value.trim()).filter(Boolean);
      angryMsgs = [...angryMsgList.querySelectorAll('.msg-input')].map(i=>i.value.trim()).filter(Boolean);
      if (!loveMsgs.length)  loveMsgs  = ['토닥토닥'];
      if (!angryMsgs.length) angryMsgs = ['혼나야겠다'];
      save('loveMsgs', loveMsgs); save('angryMsgs', angryMsgs);
      closeModal(); showToast('✅ 메시지 저장 완료!');
    });

    document.getElementById('modalRestore').addEventListener('click', () => {
      if (!confirm('메시지를 기본값으로 되돌릴까요?')) return;
      loveMsgs = [...DEFAULT_LOVE_MSGS]; angryMsgs = [...DEFAULT_ANGRY_MSGS];
      save('loveMsgs', loveMsgs); save('angryMsgs', angryMsgs);
      renderMsgList(loveMsgList, loveMsgs); renderMsgList(angryMsgList, angryMsgs);
      showToast('기본값으로 복원됐어요');
    });

    /* ══════════════════════════════════════
       하단 버튼
    ══════════════════════════════════════ */
    function showToast(msg) {
      toast.textContent = msg; toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    document.getElementById('btnReset').addEventListener('click', () => {
      if (!confirm('카운터를 초기화할까요? 메시지와 모드는 유지됩니다.')) return;
      loveCount = 0; angryCount = 0; comboStreak = 0; currentLevel = -1;
      clearTimeout(comboTimer);
      save('loveCount', 0); save('angryCount', 0);
      updateBadges(); updateComboBadge();
      showToast('🔄 카운터 초기화 완료!');
    });

    /* ══════════════════════════════════════
       튜토리얼 힌트
    ══════════════════════════════════════ */
    if (!localStorage.getItem('hintSeen')) {
      const hint = document.createElement('div');
      hint.className = 'hint'; hint.textContent = '엉덩이를 톡톡 두드려보세요';
      card.appendChild(hint);
      hint.addEventListener('animationend', () => {
        hint.remove(); localStorage.setItem('hintSeen','1');
      });
    }

    /* ── 초기화 ── */
    applyMode();
    vid.play().catch(() => {});
  })();
  </script>
</body>
</html>
